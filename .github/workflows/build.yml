name: Build Tweak

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos (env + iPhoneOS SDK)
        uses: Randomblock1/theos-action@v1
        # action 接受 theos-dir/theos-src/theos-sdks/theos-sdks-branch/orion，全部默认即可。
        # sdks 仓库 master 分支默认含 iPhoneOS16.5.sdk。
        # 注意：CI 无法 build roothide scheme —— theos-action 只 clone theos/theos + theos/sdks，
        # 不包含 libroothide（roothide 越狱设备才有）。roothide build 必须在 roothide 设备本地跑。

      - name: Install packaging deps (macOS)
        run: brew install dpkg

      - name: Build CLI helpers (rootless)
        # 每个 helper 自己一个 Makefile，subproject 形式。主 Makefile 的 after-stage:: 会
        # 从 .theos/obj/ 拷贝 build 好的 binary 进 deb staging。
        # - mcp-logreader / mcp-root / mcp-ldid: 独立 CLI（mcp-root 仅 roothide bundle，
        #   rootless 仍 build 不影响；mcp-ldid 用 vendored libcrypto.a + libplist-2.0.a）
        # - mcp-appsync/: aggregate（两个 AppSync dylib）—— bundle on rootless + roothide
        # - third_party/libzip/: vendored libzip source，deflate-only build。mcp-appinst
        #   依赖它，必须先 build。
        # - mcp-appsync/appinst: 依赖 vendored libzip.a + libz（system）。bundle on
        #   rootless + roothide（rootless 上 setuid 不可用但 CLI 本身能跑）
        # - mcp-roothelper: roothide-only（setuid + roothide.h），CI 跳过
        run: |
          echo "==> building third_party/libzip (deflate-only static lib)"
          (cd third_party/libzip && make clean && make THEOS_PACKAGE_SCHEME=rootless) || exit 1
          for h in mcp-logreader mcp-root mcp-ldid; do
            echo "==> building $h"
            (cd tools/helpers/$h && make clean && make THEOS_PACKAGE_SCHEME=rootless) || exit 1
          done
          echo "==> building mcp-appsync aggregate (AppSync dylibs)"
          (cd tools/helpers/mcp-appsync && make clean && make THEOS_PACKAGE_SCHEME=rootless) || exit 1
          echo "==> building mcp-appsync/appinst CLI (uses vendored libzip.a)"
          (cd tools/helpers/mcp-appsync/appinst && make clean && make THEOS_PACKAGE_SCHEME=rootless) || exit 1

      - name: Build package
        run: make clean && make package

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelmTweak-rootless
          path: packages/*.deb
          if-no-files-found: error
