name: Build Tweak

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos (env + iPhoneOS SDK)
        uses: Randomblock1/theos-action@v1
        # action 现接受: theos-dir / theos-src / theos-sdks / theos-sdks-branch / orion
        # 全部有默认值，sdks repo 默认含 iPhoneOS16.5.sdk。

      - name: Install packaging deps (macOS)
        run: brew install dpkg

      - name: Build package
        run: make clean && make package

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelmTweak-rootless
          path: packages/*.deb
          if-no-files-found: error
